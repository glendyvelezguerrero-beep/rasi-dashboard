<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Órdenes Operacionales y POAI</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;padding:12px;background:#102333;
  color:#172b43;font-family:Arial,sans-serif
}
#acceso{
  max-width:520px;margin:45px auto;padding:28px;
  background:#bdd0de;border-radius:12px;text-align:center
}
#acceso h1{font-size:22px;margin:0 0 18px}
button{
  padding:11px 18px;background:#155570;color:white;
  border:1px solid #9bc8df;border-radius:7px;cursor:pointer
}
button:disabled{opacity:.6;cursor:wait}
#mensaje{
  font-size:14px;overflow-wrap:anywhere;line-height:1.5
}
.barra{
  display:flex;justify-content:flex-end;margin-bottom:10px
}
.apartado{margin-bottom:24px}
.titulo{
  margin:0 0 10px;padding:14px;background:#155570;
  color:white;border:1px solid #9bc8df;
  border-radius:9px;text-align:center;font-size:25px
}
.grid{
  display:grid;
  grid-template-columns:.95fr repeat(3,minmax(0,1fr));
  gap:10px
}
.tarjeta{
  min-width:0;overflow:hidden;text-align:center;
  background:#bdd0de;border:2px solid #e1f3ff;
  border-radius:10px;padding-bottom:14px
}
.tarjeta h3{
  margin:0;padding:10px;background:#155570;
  color:white;font-size:18px
}
.general{
  grid-row:span 2;display:flex;flex-direction:column
}
.general .contenido{
  flex:1;display:flex;flex-direction:column;
  justify-content:center
}
.subtitulo{
  margin:22px 8px;color:#155570;
  font-size:14px;font-weight:bold
}
svg{
  display:block;width:100%;max-width:330px;margin:auto
}
.general svg{max-width:430px}
text{fill:#172b43;text-anchor:middle}
.numero{font-size:42px;font-weight:bold}
.meta{font-size:16px}
.extremo{font-size:13px}
.porcentaje{
  display:inline-block;padding:6px 16px;
  border:1px solid #879eac;border-radius:7px;
  font-size:23px;font-weight:bold
}
.rojo{background:#ffd6d6}
.amarillo{background:#fff0aa}
.verde{background:#cceecb}
.neutro{background:#e5edf2}
.estado{
  margin-top:8px;font-size:14px;font-weight:bold
}
@media(max-width:850px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .general{grid-column:1/-1;grid-row:auto}
  .general svg{max-width:360px}
}
@media(max-width:550px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .titulo{font-size:21px}
}
@media(max-width:350px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>
<section id="acceso">
  <h1>Acceso restringido</h1>
  <p>Inicia sesión con una cuenta de ArcGIS autorizada.</p>
  <button id="entrar" type="button" disabled>
    Conectando con ArcGIS…
  </button>
  <p id="mensaje" role="status"></p>
</section>

<main id="panel" hidden>
  <div class="barra">
    <button id="salir" type="button">
      Cerrar acceso al visualizador
    </button>
  </div>
  <div id="datos"></div>
</main>

<script>
(function(){
  "use strict";

  const $=id=>document.getElementById(id);

  const PORTAL=
    "https://daigeografia.policia.gob.ec/portal";

  const APP_ID="7m2AbpLnHeTQUF46";
  const ITEM_ID="5d37f8bbb31045378277b12a7feab023";

  const RETORNO=new URL(
    "visualizador.html",location.href
  ).href;

  const DIRECCIONES=[
    "DNPJ","DINASED","DINIC","DNIA","DINAE","DINAF"
  ];

  const METRICAS=[
    {
      titulo:"Órdenes Operacionales",
      real:"ordo_ejecut_real",
      meta:"ordo_meta",
      prefijo:"o"
    },
    {
      titulo:"POAI",
      real:"poai_ejecut_real",
      meta:"poai_ejecut_meta",
      prefijo:"p"
    }
  ];

  const formato=new Intl.NumberFormat("es-EC",{
    maximumFractionDigits:1
  });

  // Esta misma página recibe el regreso de ArcGIS.
  const respuestaOAuth=new URLSearchParams(
    location.hash.slice(1)
  );

  if(
    respuestaOAuth.has("access_token")||
    respuestaOAuth.has("error")
  ){
    $("entrar").hidden=true;
    $("mensaje").textContent=
      "Completando el inicio de sesión…";

    try{
      if(
        !window.opener||
        window.opener.closed||
        window.opener.location.origin!==location.origin
      ){
        throw new Error(
          "Abre el visualizador y vuelve a iniciar sesión desde su botón."
        );
      }

      if(typeof window.opener.require!=="function"){
        throw new Error(
          "La ventana del visualizador ya no está disponible."
        );
      }

      window.opener.require(
        ["esri/identity/IdentityManager"],
        function(identity){
          try{
            identity.setOAuthResponseHash(location.hash);

            history.replaceState(
              null,"",location.pathname+location.search
            );

            $("mensaje").textContent=
              "Regresa a la ventana del visualizador.";

            window.close();

          }catch(error){
            $("mensaje").textContent=error.message;
          }
        },
        function(){
          $("mensaje").textContent=
            "No se pudo completar el regreso al visualizador.";
        }
      );

    }catch(error){
      $("mensaje").textContent=error.message;
    }

    return;
  }

  function falloCarga(){
    $("mensaje").textContent=
      "No se pudieron cargar los componentes de ArcGIS. "+
      "Comprueba Internet y el acceso a js.arcgis.com.";

    $("entrar").disabled=false;
    $("entrar").textContent="Reintentar conexión";
    $("entrar").onclick=()=>location.reload();
  }

  let iniciado=false;

  const vigilancia=setTimeout(function(){
    if(!iniciado)falloCarga();
  },30000);

  const sdk=document.createElement("script");
  sdk.src="https://js.arcgis.com/4.31/";

  sdk.onerror=function(){
    clearTimeout(vigilancia);
    falloCarga();
  };

  sdk.onload=function(){
    if(typeof window.require!=="function"){
      clearTimeout(vigilancia);
      falloCarga();
      return;
    }

    window.require([
      "esri/identity/OAuthInfo",
      "esri/identity/IdentityManager",
      "esri/request"
    ],function(OAuthInfo,identity,request){
      iniciado=true;
      clearTimeout(vigilancia);

      try{
        arrancar(OAuthInfo,identity,request);
      }catch(error){
        falloCarga();
        $("mensaje").textContent=error.message;
      }

    },function(){
      clearTimeout(vigilancia);
      falloCarga();
    });
  };

  document.head.appendChild(sdk);

  function punto(fraccion,radio){
    const angulo=Math.PI*(1-fraccion);

    return{
      x:180+radio*Math.cos(angulo),
      y:170-radio*Math.sin(angulo)
    };
  }

  function arco(inicio,fin,radio){
    const a=punto(inicio,radio);
    const b=punto(fin,radio);

    return `M ${a.x} ${a.y} A ${radio} ${radio} 0 0 1 ${b.x} ${b.y}`;
  }

  function valores(atributos,metrica){
    if(
      !atributos||
      atributos[metrica.prefijo+"_real"]==null||
      atributos[metrica.prefijo+"_meta"]==null
    ){
      throw new Error(
        "Faltan datos para "+metrica.titulo+"."
      );
    }

    const real=Number(
      atributos[metrica.prefijo+"_real"]
    );

    const meta=Number(
      atributos[metrica.prefijo+"_meta"]
    );

    if(!Number.isFinite(real)||!Number.isFinite(meta)){
      throw new Error(
        "Se recibieron valores no válidos."
      );
    }

    return{real,meta};
  }

  function tarjeta(nombre,atributos,metrica,general){
    const {real,meta}=valores(atributos,metrica);

    const porcentaje=meta>0?real/meta*100:null;

    const avance=porcentaje===null
      ?0:Math.max(0,Math.min(100,porcentaje));

    // Límites actuales: 50 % y 80 %.
    const nivel=porcentaje===null
      ?["#8596a2","neutro","Sin meta"]
      :porcentaje<50
      ?["#dc2525","rojo","Crítico"]
      :porcentaje<80
      ?["#ffc400","amarillo","En riesgo"]
      :["#15943b","verde","Adecuado"];

    let grafico;

    if(general){
      const bandas=[
        [0,.50,"#e42525"],
        [.50,.70,"#ff7b12"],
        [.70,.85,"#edbe00"],
        [.85,.95,"#65a713"],
        [.95,1,"#12803a"]
      ];

      let marcas="";
      let etiquetas="";

      for(let i=0;i<=40;i++){
        const a=punto(i/40,140);
        const b=punto(i/40,i%8===0?154:149);

        marcas+=`
          <line x1="${a.x}" y1="${a.y}"
                x2="${b.x}" y2="${b.y}"
                stroke="#34434e"
                stroke-width="${i%8===0?3:2}"/>`;
      }

      if(meta>0){
        for(let i=0;i<=5;i++){
          const p=punto(i/5,166);

          etiquetas+=`
            <text x="${p.x}" y="${p.y-4}"
                  style="font-size:12px">${
                    formato.format(Math.round(meta*i/5))
                  }</text>`;
        }
      }

      grafico=`
        <svg viewBox="0 0 360 245"
             role="img"
             aria-label="Consolidado general: ${real} de ${meta}">
          ${bandas.map(b=>`
            <path d="${arco(b[0],b[1],125)}"
                  fill="none"
                  stroke="${b[2]}"
                  stroke-width="28"/>
          `).join("")}

          ${marcas}
          ${etiquetas}

          ${meta>0?`
            <polygon
              points="176,170 184,170 180,43"
              fill="#101820"
              transform="rotate(${-90+avance*1.8} 180 170)"/>
          `:""}

          <circle cx="180" cy="170" r="5" fill="#101820"/>

          <text x="180" y="207"
                style="font-size:36px">${
                  formato.format(real)
                }</text>

          <text x="180" y="231"
                style="font-size:14px">de ${
                  formato.format(meta)
                }</text>
        </svg>`;

    }else{
      grafico=`
        <svg viewBox="0 0 300 200"
             role="img"
             aria-label="${nombre}: ${real} de ${meta}">

          <path d="M40 145 A110 110 0 0 1 260 145"
                fill="none"
                stroke="#edf2f5"
                stroke-width="22"/>

          <path d="M40 145 A110 110 0 0 1 260 145"
                fill="none"
                stroke="${nivel[0]}"
                stroke-width="22"
                pathLength="100"
                stroke-dasharray="${avance} ${100-avance}"/>

          <text class="numero" x="150" y="120">${
            formato.format(real)
          }</text>

          <text class="meta" x="150" y="148">de ${
            formato.format(meta)
          }</text>

          <text class="extremo" x="40" y="178">0</text>

          <text class="extremo" x="260" y="178">${
            formato.format(meta)
          }</text>
        </svg>`;
    }

    return`
      <article class="tarjeta${general?" general":""}">
        <h3>${nombre}</h3>

        <div class="contenido">
          ${general?`
            <p class="subtitulo">CONSOLIDADO GENERAL</p>
          `:""}

          ${grafico}

          <div>
            <span class="porcentaje ${nivel[1]}">${
              porcentaje===null
                ?"Sin meta"
                :formato.format(porcentaje)+" %"
            }</span>
          </div>

          <div class="estado">${nivel[2]}</div>
        </div>
      </article>`;
  }

  function arrancar(OAuthInfo,identity,request){
    let autorizado=false;
    let ocupado=false;
    let tablaURL=null;
    let temporizador;
    let version=0;

    identity.registerOAuthInfos([
      new OAuthInfo({
        appId:APP_ID,
        portalUrl:PORTAL,
        popup:true,
        flowType:"implicit",
        popupCallbackUrl:RETORNO
      })
    ]);

    function bloquear(mensaje){
      autorizado=false;
      version++;

      clearTimeout(temporizador);
      tablaURL=null;

      $("datos").replaceChildren();
      $("panel").hidden=true;
      $("acceso").hidden=false;

      $("entrar").disabled=false;
      $("entrar").textContent="Iniciar sesión en ArcGIS";
      $("mensaje").textContent=mensaje;
    }

    async function pedir(url,query){
      const respuesta=await request(url,{
        query:{...query,f:"json"},
        responseType:"json",
        timeout:30000
      });

      if(respuesta.data.error){
        throw new Error(
          respuesta.data.error.message||"Error de ArcGIS."
        );
      }

      if(respuesta.data.exceededTransferLimit){
        throw new Error(
          "El servidor devolvió resultados incompletos."
        );
      }

      return respuesta.data;
    }

    async function resolver(){
      const item=await pedir(
        PORTAL+"/sharing/rest/content/items/"+ITEM_ID,
        {}
      );

      if(!item.url){
        throw new Error(
          "No se pudo acceder a la vista privada con esta cuenta."
        );
      }

      const base=item.url.replace(/\/+$/,"");

      const camposNecesarios=[
        "direccion",
        ...METRICAS.flatMap(m=>[m.real,m.meta])
      ];

      function valido(detalle){
        return camposNecesarios.every(
          campo=>(detalle.fields||[]).some(
            f=>f.name===campo
          )
        );
      }

      if(/\/FeatureServer\/\d+$/i.test(base)){
        if(valido(await pedir(base,{}))){
          return base;
        }

      }else if(/\/FeatureServer$/i.test(base)){
        const servicio=await pedir(base,{});

        for(const tabla of [
          ...(servicio.tables||[]),
          ...(servicio.layers||[])
        ]){
          const url=base+"/"+tabla.id;

          if(valido(await pedir(url,{}))){
            return url;
          }
        }
      }

      throw new Error(
        "La vista debe incluir direccion y los cuatro campos "+
        "estadísticos de POAI y Órdenes Operacionales."
      );
    }

    async function consultar(general){
      const query={
        where:"1=1",
        returnGeometry:false,
        outStatistics:JSON.stringify(
          METRICAS.flatMap(m=>[
            {
              statisticType:"sum",
              onStatisticField:m.real,
              outStatisticFieldName:m.prefijo+"_real"
            },
            {
              statisticType:"sum",
              onStatisticField:m.meta,
              outStatisticFieldName:m.prefijo+"_meta"
            }
          ])
        )
      };

      if(!general){
        query.groupByFieldsForStatistics="direccion";
      }

      return pedir(tablaURL+"/query",query);
    }

    async function actualizar(){
      if(!autorizado||ocupado)return;

      ocupado=true;
      clearTimeout(temporizador);

      const actual=version;

      try{
        await identity.checkSignInStatus(
          PORTAL+"/sharing"
        );

        if(!tablaURL){
          tablaURL=await resolver();
        }

        if(actual!==version||!autorizado)return;

        const [grupos,total]=await Promise.all([
          consultar(false),
          consultar(true)
        ]);

        if(actual!==version||!autorizado)return;

        const mapa=new Map(
          (grupos.features||[]).map(f=>[
            f.attributes.direccion,
            f.attributes
          ])
        );

        const contenido=METRICAS.map(m=>
          `<section class="apartado">
            <h2 class="titulo">${m.titulo}</h2>
            <div class="grid">`+

            tarjeta(
              "DGIN",
              total.features?.[0]?.attributes,
              m,
              true
            )+

            DIRECCIONES.map(d=>
              tarjeta(d,mapa.get(d),m,false)
            ).join("")+

          "</div></section>"
        ).join("");

        $("datos").innerHTML=contenido;
        $("acceso").hidden=true;
        $("panel").hidden=false;

      }catch(error){
        if(actual===version){
          bloquear(
            error.message||
            "No se pudieron consultar los datos."
          );
        }

      }finally{
        ocupado=false;

        if(autorizado&&actual===version){
          temporizador=setTimeout(
            actualizar,
            60000
          );
        }
      }
    }

    $("entrar").onclick=async function(){
      if(ocupado)return;

      $("entrar").disabled=true;

      $("mensaje").textContent=
        "Completa el inicio de sesión en la ventana de ArcGIS. "+
        "Permite las ventanas emergentes si el navegador las bloquea.";

      try{
        await identity.getCredential(
          PORTAL+"/sharing",
          {oAuthPopupConfirmation:false}
        );

        autorizado=true;

        $("mensaje").textContent=
          "Consultando las estadísticas…";

        await actualizar();

      }catch(error){
        bloquear(
          error.message||
          "No se completó el inicio de sesión."
        );
      }
    };

    $("salir").onclick=function(){
      identity.destroyCredentials();

      bloquear(
        "Acceso al visualizador cerrado. "+
        "La sesión del portal institucional puede seguir abierta."
      );
    };

    bloquear(
      "Los datos se mostrarán únicamente después de "+
      "iniciar sesión y comprobar tus permisos."
    );
  }

})();
</script>
</body>
</html>
