<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estadísticas</title>

<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;padding:10px;background:#102333;
  color:#172b43;font-family:Arial,sans-serif
}
header{
  padding:14px;margin-bottom:10px;text-align:center;
  background:#155570;color:white;
  border:1px solid #9bc8df;border-radius:10px
}
h1{margin:0;font-size:25px}
#acceso{
  max-width:480px;margin:50px auto;padding:30px;
  background:#bdd0de;border-radius:12px;text-align:center
}
button{
  padding:12px 20px;border:0;border-radius:7px;
  background:#155570;color:white;cursor:pointer
}
button:disabled{opacity:.6;cursor:wait}
#mensaje{overflow-wrap:anywhere;font-size:14px}
.tablero{
  display:grid;
  grid-template-columns:.95fr repeat(3,minmax(0,1fr));
  gap:10px
}
.tarjeta{
  min-width:0;overflow:hidden;padding-bottom:14px;
  text-align:center;background:#bdd0de;
  border:2px solid #e1f3ff;border-radius:10px
}
h2{
  margin:0;padding:10px;background:#155570;
  color:white;font-size:18px
}
.general{
  grid-row:span 2;display:flex;flex-direction:column
}
.contenido{
  display:flex;flex-direction:column
}
.general .contenido{
  flex:1;justify-content:center
}
.subtitulo{
  margin:22px 8px;color:#155570;
  font-size:14px;font-weight:bold
}
svg{
  display:block;width:100%;max-width:340px;margin:auto
}
.general svg{max-width:440px}
text{fill:#172b43;text-anchor:middle}
.pista,.avance{fill:none;stroke-width:22}
.pista{stroke:#edf2f5}
.avance{stroke:#8596a2}
.numero{font-size:42px;font-weight:bold}
.meta{font-size:16px}
.extremo{font-size:13px}
.porcentaje{
  display:inline-block;padding:6px 16px;
  border:1px solid #879eac;border-radius:7px;
  background:#e5edf2;font-size:23px;font-weight:bold
}
.estado{
  margin-top:8px;font-size:14px;font-weight:bold
}
@media(max-width:850px){
  .tablero{grid-template-columns:repeat(3,minmax(0,1fr))}
  .general{grid-column:1/-1;grid-row:auto}
  .general svg{max-width:360px}
}
@media(max-width:550px){
  .tablero{grid-template-columns:repeat(2,minmax(0,1fr))}
  h1{font-size:21px}
}
@media(max-width:350px){
  .tablero{grid-template-columns:1fr}
}
</style>
</head>

<body>
<header><h1 id="titulo"></h1></header>

<section id="acceso">
  <h2>Acceso restringido</h2>
  <p>Inicia sesión con una cuenta de ArcGIS autorizada.</p>
  <button id="entrar" type="button" disabled>
    Cargando conexión…
  </button>
  <p id="mensaje" role="status"></p>
</section>

<main id="tablero" class="tablero" hidden></main>

<script>
window.falloConexion=function(){
  const boton=document.getElementById("entrar");
  document.getElementById("mensaje").textContent=
    "No se pudo cargar la conexión con ArcGIS. "+
    "Comprueba Internet y vuelve a intentar.";
  boton.disabled=false;
  boton.textContent="Reintentar conexión";
  boton.onclick=function(){location.reload()};
};

window.esperaArcGIS=setTimeout(function(){
  if(!window.componentesArcGISListos){
    window.falloConexion();
  }
},30000);
</script>

<script src="https://js.arcgis.com/4.31/"
        onerror="falloConexion()"></script>

<script>
(function(){
  "use strict";

  const $=id=>document.getElementById(id);
  const archivo=location.pathname.split("/").pop().toLowerCase();

  if(archivo!=="poai.html" && archivo!=="dnpj.html"){
    clearTimeout(window.esperaArcGIS);
    $("mensaje").textContent=
      "Guarda esta página como poai.html o dnpj.html.";
    $("entrar").textContent="Nombre de archivo no válido";
    return;
  }

  const ES_POAI=archivo==="poai.html";
  const TITULO=ES_POAI?"POAI":"Órdenes Operacionales";
  const REAL=ES_POAI?"poai_ejecut_real":"ordo_ejecut_real";
  const META=ES_POAI?"poai_ejecut_meta":"ordo_meta";

  const PORTAL="https://daigeografia.policia.gob.ec/portal";
  const ITEM_ID="5d37f8bbb31045378277b12a7feab023";
  const APP_ID="7m2AbpLnHeTQUF46";

  const DIRECCIONES=[
    "DNPJ","DINASED","DINIC","DNIA","DINAE","DINAF"
  ];

  const IDS=["TOTAL",...DIRECCIONES];

  // Criterios actuales de clasificación.
  const LIMITE_CRITICO=50;
  const LIMITE_ADECUADO=80;

  const formato=new Intl.NumberFormat("es-EC",{
    maximumFractionDigits:1
  });

  document.title=TITULO;
  $("titulo").textContent=TITULO;

  function punto(fraccion,radio){
    const angulo=Math.PI*(1-fraccion);
    return {
      x:180+radio*Math.cos(angulo),
      y:170-radio*Math.sin(angulo)
    };
  }

  function arco(inicio,fin,radio){
    const a=punto(inicio,radio);
    const b=punto(fin,radio);
    return `M ${a.x} ${a.y} A ${radio} ${radio} 0 0 1 ${b.x} ${b.y}`;
  }

  function crearTarjeta(id){
    const general=id==="TOTAL";
    const tarjeta=document.createElement("section");
    tarjeta.className="tarjeta"+(general?" general":"");

    const grafico=general?`
      <svg viewBox="0 0 360 245"
           role="img" aria-labelledby="${id}-lectura">
        <title id="${id}-lectura">Sin consultar</title>
        <g id="franjas"></g>
        <g id="marcas"></g>
        <g id="etiquetas"></g>
        <polygon id="aguja"
          points="176,170 184,170 180,43"
          fill="#101820" visibility="hidden"/>
        <circle cx="180" cy="170" r="5" fill="#101820"/>
        <text id="${id}-valor" x="180" y="207"
              style="font-size:36px">—</text>
        <text id="${id}-meta" x="180" y="231"
              style="font-size:14px">Sin consultar</text>
      </svg>`:`
      <svg viewBox="0 0 300 200"
           role="img" aria-labelledby="${id}-lectura">
        <title id="${id}-lectura">Sin consultar</title>
        <path class="pista"
              d="M40 145 A110 110 0 0 1 260 145"/>
        <path id="${id}-arco" class="avance"
              d="M40 145 A110 110 0 0 1 260 145"
              pathLength="100" stroke-dasharray="0 100"/>
        <text id="${id}-valor" class="numero"
              x="150" y="120">—</text>
        <text id="${id}-meta" class="meta"
              x="150" y="148">Sin consultar</text>
        <text class="extremo" x="40" y="178">0</text>
        <text id="${id}-maximo" class="extremo"
              x="260" y="178">—</text>
      </svg>`;

    tarjeta.innerHTML=`
      <h2>${general?"DGIN":id}</h2>
      <div class="contenido">
        ${general?'<p class="subtitulo">CONSOLIDADO GENERAL</p>':""}
        ${grafico}
        <div>
          <span id="${id}-porcentaje" class="porcentaje">—</span>
        </div>
        <div id="${id}-estado" class="estado">Sin consultar</div>
      </div>`;

    $("tablero").appendChild(tarjeta);
  }

  IDS.forEach(crearTarjeta);

  const bandas=[
    [0,.50,"#e42525"],
    [.50,.70,"#ff7b12"],
    [.70,.85,"#edbe00"],
    [.85,.95,"#65a713"],
    [.95,1,"#12803a"]
  ];

  $("franjas").innerHTML=bandas.map(b=>
    `<path d="${arco(b[0],b[1],125)}"
      fill="none" stroke="${b[2]}" stroke-width="28"/>`
  ).join("");

  let marcas="";
  for(let i=0;i<=40;i++){
    const a=punto(i/40,140);
    const b=punto(i/40,i%8===0?154:149);
    marcas+=`
      <line x1="${a.x}" y1="${a.y}"
            x2="${b.x}" y2="${b.y}"
            stroke="#34434e"
            stroke-width="${i%8===0?3:2}"/>`;
  }
  $("marcas").innerHTML=marcas;

  function limpiar(){
    IDS.forEach(id=>{
      $(id+"-valor").textContent="—";
      $(id+"-meta").textContent="Datos no disponibles";
      $(id+"-porcentaje").textContent="—";
      $(id+"-porcentaje").style.background="#e5edf2";
      $(id+"-estado").textContent="Sin consultar";
      $(id+"-lectura").textContent="Datos no disponibles";

      if(id!=="TOTAL"){
        $(id+"-maximo").textContent="—";
        $(id+"-arco").setAttribute("stroke-dasharray","0 100");
      }
    });

    $("aguja").setAttribute("visibility","hidden");
    $("etiquetas").innerHTML="";
  }

  function mostrar(id,atributos){
    if(
      !atributos ||
      atributos.ejecutadas==null ||
      atributos.meta_total==null
    ){
      throw new Error(
        "Faltan datos de "+(id==="TOTAL"?"DGIN":id)+"."
      );
    }

    const valor=Number(atributos.ejecutadas);
    const meta=Number(atributos.meta_total);

    if(!Number.isFinite(valor)||!Number.isFinite(meta)){
      throw new Error("Valores no válidos en "+id+".");
    }

    $(id+"-valor").textContent=formato.format(valor);
    $(id+"-meta").textContent="de "+formato.format(meta);

    if(id!=="TOTAL"){
      $(id+"-maximo").textContent=formato.format(meta);
    }

    if(meta<=0){
      $(id+"-porcentaje").textContent="Sin meta";
      $(id+"-estado").textContent="Porcentaje no calculable";
      $(id+"-lectura").textContent="Sin meta mayor que cero";
      return;
    }

    const porcentaje=valor/meta*100;
    const avance=Math.max(0,Math.min(100,porcentaje));

    const nivel=porcentaje<LIMITE_CRITICO
      ?["#dc2525","#ffd6d6","Crítico"]
      :porcentaje<LIMITE_ADECUADO
      ?["#ffc400","#fff0aa","En riesgo"]
      :["#15943b","#cceecb","Adecuado"];

    if(id==="TOTAL"){
      $("aguja").setAttribute(
        "transform",
        `rotate(${-90+avance*1.8} 180 170)`
      );
      $("aguja").setAttribute("visibility","visible");

      let etiquetas="";
      for(let i=0;i<=5;i++){
        const p=punto(i/5,166);
        etiquetas+=`
          <text x="${p.x}" y="${p.y-4}"
                style="font-size:12px">${
                  formato.format(Math.round(meta*i/5))
                }</text>`;
      }
      $("etiquetas").innerHTML=etiquetas;

    }else{
      $(id+"-arco").style.stroke=nivel[0];
      $(id+"-arco").setAttribute(
        "stroke-dasharray",
        avance+" "+(100-avance)
      );
    }

    $(id+"-porcentaje").textContent=
      formato.format(porcentaje)+" %";
    $(id+"-porcentaje").style.background=nivel[1];
    $(id+"-estado").textContent=nivel[2];
    $(id+"-lectura").textContent=
      `${valor} de ${meta}, ${formato.format(porcentaje)} por ciento.`;
  }

  if(typeof window.require!=="function"){
    clearTimeout(window.esperaArcGIS);
    window.falloConexion();
    return;
  }

  require([
    "esri/identity/OAuthInfo",
    "esri/identity/IdentityManager",
    "esri/request"
  ],function(OAuthInfo,identity,request){

    window.componentesArcGISListos=true;
    clearTimeout(window.esperaArcGIS);

    let autorizado=false;
    let ocupado=false;
    let temporizador;
    let tablaURL=null;

    function bloquear(mensaje){
      autorizado=false;
      clearTimeout(temporizador);
      tablaURL=null;
      limpiar();

      $("tablero").hidden=true;
      $("acceso").hidden=false;
      $("mensaje").textContent=mensaje;
      $("entrar").disabled=false;
      $("entrar").textContent="Iniciar sesión en ArcGIS";
    }

    try{
      identity.registerOAuthInfos([
        new OAuthInfo({
          appId:APP_ID,
          portalUrl:PORTAL,
          popup:true,
          flowType:"implicit",
          popupCallbackUrl:new URL(
            "oauth-callback.html",
            location.href
          ).href
        })
      ]);
    }catch(error){
      bloquear(
        "No se pudo configurar la conexión: "+error.message
      );
      return;
    }

    async function pedir(url,query){
      const respuesta=await request(url,{
        query:query,
        responseType:"json",
        timeout:30000
      });

      const datos=respuesta.data;

      if(datos.error){
        throw new Error(
          datos.error.message||"Error de ArcGIS."
        );
      }

      return datos;
    }

    async function resolverTabla(){
      const item=await pedir(
        PORTAL+"/sharing/rest/content/items/"+ITEM_ID,
        {f:"json"}
      );

      if(!item.url){
        throw new Error(
          "El elemento no tiene un servicio asociado o no tienes acceso."
        );
      }

      const servicioURL=item.url.replace(/\/+$/,"");

      // También admite elementos que apuntan directamente a una tabla.
      if(/\/FeatureServer\/\d+$/i.test(servicioURL)){
        const detalle=await pedir(servicioURL,{f:"json"});
        validarCampos(detalle);
        return servicioURL;
      }

      if(!/\/FeatureServer$/i.test(servicioURL)){
        throw new Error(
          "El elemento seleccionado no apunta a un FeatureServer."
        );
      }

      const servicio=await pedir(servicioURL,{f:"json"});
      const tablas=[
        ...(servicio.tables||[]),
        ...(servicio.layers||[])
      ];

      for(const tabla of tablas){
        const url=servicioURL+"/"+tabla.id;
        const detalle=await pedir(url,{f:"json"});
        const campos=(detalle.fields||[]).map(c=>c.name);

        if(
          ["direccion",REAL,META].every(
            nombre=>campos.includes(nombre)
          )
        ){
          return url;
        }
      }

      throw new Error(
        "No se encontró una tabla con los campos requeridos para "+TITULO+"."
      );
    }

    function validarCampos(detalle){
      const campos=(detalle.fields||[]).map(c=>c.name);
      if(
        !["direccion",REAL,META].every(
          nombre=>campos.includes(nombre)
        )
      ){
        throw new Error(
          "La tabla no contiene los campos requeridos para "+TITULO+"."
        );
      }
    }

    async function consultar(general){
      const query={
        f:"json",
        where:general
          ?"1=1"
          :"direccion IN ("+
            DIRECCIONES.map(d=>"'"+d+"'").join(",")+")",
        returnGeometry:false,
        outStatistics:JSON.stringify([
          {
            statisticType:"sum",
            onStatisticField:REAL,
            outStatisticFieldName:"ejecutadas"
          },
          {
            statisticType:"sum",
            onStatisticField:META,
            outStatisticFieldName:"meta_total"
          }
        ])
      };

      if(!general){
        query.groupByFieldsForStatistics="direccion";
      }

      const datos=await pedir(tablaURL+"/query",query);

      if(datos.exceededTransferLimit){
        throw new Error(
          "El servidor devolvió resultados incompletos."
        );
      }

      return datos.features||[];
    }

    async function actualizar(){
      if(!autorizado||ocupado) return;

      ocupado=true;
      clearTimeout(temporizador);

      try{
        await identity.checkSignInStatus(
          PORTAL+"/sharing"
        );

        if(!tablaURL){
          tablaURL=await resolverTabla();
        }

        const [direcciones,general]=await Promise.all([
          consultar(false),
          consultar(true)
        ]);

        limpiar();

        const mapa=new Map(
          direcciones.map(f=>[
            f.attributes.direccion,
            f.attributes
          ])
        );

        DIRECCIONES.forEach(
          direccion=>mostrar(
            direccion,
            mapa.get(direccion)
          )
        );

        mostrar("TOTAL",general[0]?.attributes);

        $("acceso").hidden=true;
        $("tablero").hidden=false;

      }catch(error){
        bloquear(
          error.message||
          "No se pudo verificar el acceso a los datos."
        );

      }finally{
        ocupado=false;
        if(autorizado){
          temporizador=setTimeout(
            actualizar,
            60000
          );
        }
      }
    }

    $("entrar").onclick=async function(){
      $("entrar").disabled=true;
      $("mensaje").textContent=
        "Completa el inicio de sesión en la ventana de ArcGIS. "+
        "Permite las ventanas emergentes si el navegador las bloquea.";

      try{
        await identity.getCredential(
          PORTAL+"/sharing",
          {oAuthPopupConfirmation:false}
        );

        autorizado=true;
        await actualizar();

      }catch(error){
        bloquear(
          error.message||
          "No se completó el inicio de sesión."
        );
      }
    };

    bloquear(
      "Inicia sesión para consultar las estadísticas."
    );

  },function(error){
    clearTimeout(window.esperaArcGIS);
    window.falloConexion();

    $("mensaje").textContent=
      "No se pudieron cargar los componentes de ArcGIS. "+
      (error.message||"");
  });

})();
</script>
</body>
</html>
